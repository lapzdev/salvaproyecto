  <!--   Modelo de Caja: es la form en que CSS ve a los elementos HTML ¿y cómo los ve? como cajas que constan de las siguientes propiedades:
1) Contenido(content):el contenido(texto) del elemento html tomando en cuenta sus dimensiones:ancho(width)  y alto(height) 
2)Borde(border):lo que delimita coda uno de los elementos html
3)Relleno(padding):son las distancias internas(distancia del borde al contenido.
 4)Margen(margin):son las distancias externas(distancia entre el elemento html y sus elementos hermanos o padres.
 Dentro del modelo de caja podemos considerar que una caja tiene 4 lados:
 1)Arriba(top)
 2)Derecha(right)
 3)Abajo(botttom)
 4)Izquierda(left)
 se denota siguiendo el sentido de las manecillas del reloj a partir de Arriba(top).
 


 -->
