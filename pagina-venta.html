<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas de Ventas | Panel de publicación</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#16203a;
    --muted:#6b7690;
    --line:#e4e9f2;
    --primary:#3b6ef6;
    --primary-dark:#2a55cc;
    --ok-bg:#e6f7ee;   --ok-tx:#0d7a3e;
    --warn-bg:#fff5e0; --warn-tx:#a86a00;
    --off-bg:#f0f1f5;  --off-tx:#6b7690;
    --danger:#e5484d;
    --radius:16px;
    --shadow:0 4px 16px rgba(22,32,58,.07);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  button{font-family:inherit}
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
    padding:14px 24px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px}
  .logo{
    width:44px;height:44px;border-radius:13px;
    background:linear-gradient(135deg,var(--primary),#7c5cff);
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 6px 16px rgba(59,110,246,.35);
  }
  .brand h1{font-size:18px;margin:0;letter-spacing:-.3px}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .acciones-top{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    border:1px solid transparent; border-radius:11px;
    padding:10px 16px; font-size:14px; font-weight:600;
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .btn.primary{background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(59,110,246,.3)}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{background:#f7f9fd;border-color:#cfd8e8}
  main{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:var(--card); padding:12px; border-radius:var(--radius);
    border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .buscador{
    flex:1 1 260px; display:flex; align-items:center; gap:8px;
    background:#f7f9fd; border:1px solid var(--line); border-radius:11px;
    padding:0 12px;
  }
  .buscador input{
    border:none; background:transparent; outline:none;
    padding:10px 0; font-size:14px; width:100%; color:var(--text);
  }
  .toolbar select{
    padding:10px 12px; border-radius:11px; font-size:14px;
    border:1px solid var(--line); background:#f7f9fd; color:var(--text);
    cursor:pointer; outline:none;
  }
  .toolbar select:focus,.buscador:focus-within{border-color:var(--primary)}
  .resumen{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:8px;
    margin:18px 4px 14px; font-size:13.5px; color:var(--muted);
  }
  .resumen strong{color:var(--text)}
  .grid{
    display:grid; gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(275px,1fr));
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column;
    box-shadow:var(--shadow); transition:.18s;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(22,32,58,.12)}
  .card-img{
    position:relative; height:150px; overflow:hidden;
    background:linear-gradient(135deg,#3b6ef6,#7c5cff);
    display:grid; place-items:center;
  }
  .card-img .letra{font-size:46px; font-weight:800; color:rgba(255,255,255,.8)}
  .card-img img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .card-body{padding:15px 16px 14px; display:flex; flex-direction:column; gap:9px; flex:1}
  .card-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .badge{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px;
    letter-spacing:.2px;
  }
  .badge.ok{background:var(--ok-bg); color:var(--ok-tx)}
  .badge.warn{background:var(--warn-bg); color:var(--warn-tx)}
  .badge.off{background:var(--off-bg); color:var(--off-tx)}
  .cat{
    font-size:11.5px; color:var(--muted); background:#f3f5fa;
    padding:4px 9px; border-radius:99px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:130px;
  }
  .card h3{margin:0; font-size:16.5px; line-height:1.3; letter-spacing:-.2px}
  .desc{
    margin:0; font-size:13.3px; color:var(--muted); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .cliente{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px}
  .precio{
    font-size:22px; font-weight:800; letter-spacing:-.6px; color:var(--primary);
    margin-top:auto;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; border-top:1px solid var(--line); padding-top:11px; margin-top:2px;
  }
  .fecha{font-size:11.8px; color:var(--muted)}
  .mini-btns{display:flex; gap:6px}
  .icon-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:14px; display:grid; place-items:center;
    transition:.15s;
  }
  .icon-btn:hover{background:#f2f6ff; border-color:#c3d3f7}
  .icon-btn.del:hover{background:#fdeced; border-color:#f5c2c4}
  .contactos{display:flex; gap:8px; flex-wrap:wrap}
  .chip{
    font-size:12.3px; text-decoration:none; font-weight:600;
    padding:6px 11px; border-radius:9px; display:inline-flex; align-items:center; gap:5px;
    background:#eef4ff; color:var(--primary-dark); border:1px solid #dbe6ff;
  }
  .chip:hover{background:#e2ecff}
  .chip.wa{background:#e7f9ef; color:#0d7a3e; border-color:#c8f0d9}
  .chip.wa:hover{background:#d8f4e5}
  .vacio{
    text-align:center; padding:70px 20px; color:var(--muted);
    background:var(--card); border:1px dashed #d5dceb; border-radius:var(--radius);
  }
  .vacio-icon{font-size:52px; margin-bottom:10px}
  .vacio h3{margin:0 0 6px; color:var(--text); font-size:18px}
  .vacio p{margin:0 0 18px; font-size:14px}
  .oculto{display:none !important}
  dialog{
    border:none; border-radius:18px; padding:0;
    width:min(680px,93vw); max-height:92vh;
    box-shadow:0 28px 70px rgba(15,25,50,.3);
    color:var(--text);
  }
  dialog::backdrop{background:rgba(15,25,50,.55); backdrop-filter:blur(3px)}
  #formOferta{display:flex; flex-direction:column; max-height:92vh}
  .dlg-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 14px; border-bottom:1px solid var(--line);
  }
  .dlg-head h2{margin:0; font-size:18px; letter-spacing:-.3px}
  .cerrar{
    border:none; background:#f2f4f9; width:34px; height:34px; border-radius:10px;
    cursor:pointer; font-size:15px; color:var(--muted);
  }
  .cerrar:hover{background:#e8ebf3; color:var(--text)}
  .dlg-body{
    padding:18px 22px; overflow-y:auto;
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .campo{display:flex; flex-direction:column; gap:6px}
  .campo.ancho{grid-column:1/-1}
  .campo label{font-size:13px; font-weight:600; color:#3c4760}
  .campo input,.campo select,.campo textarea{
    padding:10px 12px; border-radius:11px; font-size:14px;
    border:1px solid var(--line); background:#f9fafd; color:var(--text);
    outline:none; font-family:inherit; transition:.15s; width:100%;
  }
  .campo textarea{resize:vertical; min-height:80px}
  .campo input:focus,.campo select:focus,.campo textarea:focus{
    border-color:var(--primary); background:#fff;
    box-shadow:0 0 0 3px rgba(59,110,246,.13);
  }
  .prefijo{display:flex; gap:8px}
  .prefijo select{flex:0 0 105px}
  .dlg-foot{
    display:flex; justify-content:flex-end; gap:10px;
    padding:14px 22px 18px; border-top:1px solid var(--line); background:#fbfcfe;
  }
  @media(max-width:620px){
    main{padding:16px 14px 50px}
    .topbar{padding:12px 14px}
    .brand p{display:none}
    .dlg-body{grid-template-columns:1fr}
    .acciones-top .btn.ghost{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🛍️</div>
    <div>
      <h1>Ofertas de Ventas</h1>
      <p>Publica y gestiona las ofertas de tus clientes</p>
    </div>
  </div>
  <div class="acciones-top">
    <button class="btn ghost" id="btnExportar">⬇ Exportar</button>
    <button class="btn primary" id="btnNueva">+ Nueva oferta</button>
  </div>
</header>

<main>
  <section class="toolbar">
    <div class="buscador">
      <span>🔍</span>
      <input id="buscar" type="search" placeholder="Buscar por cliente, producto o descripción...">
    </div>
    <select id="filtroEstado">
      <option value="">Todos los estados</option>
      <option value="Disponible">Disponible</option>
      <option value="Reservado">Reservado</option>
      <option value="Vendido">Vendido</option>
    </select>
    <select id="filtroCategoria">
      <option value="">Todas las categorías</option>
    </select>
    <select id="orden">
      <option value="recientes">Más recientes</option>
      <option value="antiguos">Más antiguos</option>
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="cliente">Cliente (A–Z)</option>
    </select>
  </section>

  <div class="resumen">
    <span id="contador">0 ofertas</span>
    <span id="stats"></span>
  </div>

  <section id="grid" class="grid"></section>

  <div id="vacio" class="vacio">
    <div class="vacio-icon">📦</div>
    <h3>No hay ofertas todavía</h3>
    <p>Publica la primera oferta de venta de tus clientes.</p>
    <button class="btn primary" id="btnVacio">+ Crear la primera oferta</button>
  </div>
</main>

<!-- ============ MODAL DE FORMULARIO ============ -->
<dialog id="dlg">
  <form id="formOferta" novalidate>
    <header class="dlg-head">
      <h2 id="dlgTitulo">Nueva oferta</h2>
      <button type="button" class="cerrar" id="btnCerrar" title="Cerrar">✕</button>
    </header>

    <div class="dlg-body">
      <input type="hidden" id="id">

      <div class="campo">
        <label for="cliente">Cliente *</label>
        <input id="cliente" required maxlength="60" placeholder="Ej: María González">
      </div>

      <div class="campo">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input id="telefono" type="tel" maxlength="25" placeholder="+58 412 1234567">
      </div>

      <div class="campo ancho">
        <label for="producto">Producto o servicio *</label>
        <input id="producto" required maxlength="90" placeholder="Ej: Laptop Lenovo IdeaPad 3">
      </div>

      <div class="campo">
        <label for="categoria">Categoría</label>
        <input id="categoria" list="listaCategorias" maxlength="40" placeholder="Ej: Tecnología">
        <datalist id="listaCategorias"></datalist>
      </div>

      <div class="campo">
        <label for="estado">Estado</label>
        <select id="estado">
          <option>Disponible</option>
          <option>Reservado</option>
          <option>Vendido</option>
        </select>
      </div>

      <div class="campo ancho">
        <label for="precio">Precio *</label>
        <div class="prefijo">
          <select id="moneda">
            <option value="USD">USD $</option>
            <option value="EUR">EUR €</option>
            <option value="MXN">MXN $</option>
            <option value="COP">COP $</option>
            <option value="ARS">ARS $</option>
            <option value="PEN">PEN S/</option>
            <option value="CLP">CLP $</option>
            <option value="VES">VES Bs</option>
            <option value="BOB">BOB Bs</option>
            <option value="UYU">UYU $U</option>
            <option value="PYG">PYG ₲</option>
            <option value="BRL">BRL R$</option>
            <option value="GTQ">GTQ Q</option>
            <option value="DOP">DOP RD$</option>
            <option value="CRC">CRC ₡</option>
          </select>
          <input id="precio" type="number" min="0" step="0.01" required placeholder="0.00">
        </div>
      </div>

      <div class="campo ancho">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" maxlength="500" placeholder="Detalles, condiciones, estado del producto, forma de entrega..."></textarea>
      </div>

      <div class="campo ancho">
        <label for="email">Correo de contacto</label>
        <input id="email" type="email" maxlength="80" placeholder="cliente@correo.com">
      </div>

      <div class="campo ancho">
        <label for="imagen">URL de imagen (opcional)</label>
        <input id="imagen" type="url" maxlength="400" placeholder="https://...">
      </div>
    </div>

    <footer class="dlg-foot">
      <button type="button" class="btn ghost" id="btnCancelar">Cancelar</button>
      <!-- ▼▼▼ CAMBIO CLAVE: type="button" en lugar de type="submit" ▼▼▼ -->
      <button type="button" class="btn primary" id="btnGuardar">Publicar oferta</button>
    </footer>
  </form>
</dialog>

<script>
/* ==================== DATOS ==================== */
const CLAVE = 'ofertas_ventas_v1';
const CATEGORIAS_BASE = [
  'Tecnología','Ropa y accesorios','Hogar','Vehículos','Servicios',
  'Alimentos','Salud y belleza','Muebles','Inmuebles','Otros'
];
const SIMBOLOS = {
  USD:'$',EUR:'€',MXN:'$',COP:'$',ARS:'$',PEN:'S/',CLP:'$',VES:'Bs',
  BOB:'Bs',UYU:'$U',PYG:'₲',BRL:'R$',GTQ:'Q',DOP:'RD$',CRC:'₡'
};

let ofertas = [];
let editandoId = null;

/* ==================== UTILIDADES ==================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function uid() {
  // Fallback seguro para entornos sin crypto.randomUUID
  try {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
  } catch (e) { /* ignorar */ }
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

function formatoPrecio(precio, moneda) {
  const n = Number(precio || 0).toLocaleString('es-ES', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
  return (SIMBOLOS[moneda] || moneda || '') + ' ' + n;
}

function formatoFecha(iso) {
  try {
    return new Date(iso).toLocaleDateString('es-ES',
      { day:'numeric', month:'short', year:'numeric' });
  } catch { return ''; }
}

function claseEstado(estado) {
  return { 'Disponible':'ok', 'Reservado':'warn', 'Vendido':'off' }[estado] || 'ok';
}

/* ==================== ALMACENAMIENTO ==================== */
function cargar() {
  try {
    const raw = localStorage.getItem(CLAVE);
    ofertas = raw ? JSON.parse(raw) : [];
  } catch (e) {
    ofertas = [];
  }
  if (!Array.isArray(ofertas)) ofertas = [];
}

function persistir() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(ofertas));
  } catch (e) {
    console.warn('No se pudo guardar en localStorage:', e);
  }
}

/* ==================== RENDER ==================== */
const grid = $('grid'), vacio = $('vacio');

function render() {
  const q  = $('buscar').value.trim().toLowerCase();
  const fe = $('filtroEstado').value;
  const fc = $('filtroCategoria').value;
  const ord = $('orden').value;

  let lista = ofertas.filter(o => {
    if (fe && o.estado !== fe) return false;
    if (fc && o.categoria !== fc) return false;
    if (q) {
      const texto = `${o.cliente} ${o.producto} ${o.descripcion || ''} ${o.categoria || ''}`
        .toLowerCase();
      if (!texto.includes(q)) return false;
    }
    return true;
  });

  const ordenadores = {
    'recientes':   (a,b) => new Date(b.creado) - new Date(a.creado),
    'antiguos':    (a,b) => new Date(a.creado) - new Date(b.creado),
    'precio-desc': (a,b) => Number(b.precio) - Number(a.precio),
    'precio-asc':  (a,b) => Number(a.precio) - Number(b.precio),
    'cliente':     (a,b) => String(a.cliente).localeCompare(String(b.cliente), 'es')
  };
  lista.sort(ordenadores[ord] || ordenadores['recientes']);

  grid.innerHTML = lista.map(o => {
    const inicial = esc((o.cliente || '?').trim().charAt(0).toUpperCase());
    const img = o.imagen
      ? `<img src="${esc(o.imagen)}" alt="" loading="lazy"
              onerror="this.remove()">`
      : '';
    const telDigitos = String(o.telefono || '').replace(/\D/g, '');
    const wa = telDigitos
      ? `<a class="chip wa" target="_blank" rel="noopener"
            href="https://wa.me/${telDigitos}?text=${encodeURIComponent('Hola, vi tu oferta de "' + o.producto + '" y me interesa.')}">
            💬 WhatsApp</a>`
      : '';
    const mail = o.email
      ? `<a class="chip" href="mailto:${esc(o.email)}?subject=${encodeURIComponent('Interés en: ' + o.producto)}">✉️ Correo</a>`
      : '';

    return `
      <article class="card">
        <div class="card-img">
          <span class="letra">${inicial}</span>
          ${img}
        </div>
        <div class="card-body">
          <div class="card-top">
            <span class="badge ${claseEstado(o.estado)}">${esc(o.estado || 'Disponible')}</span>
            ${o.categoria ? `<span class="cat">${esc(o.categoria)}</span>` : ''}
          </div>
          <h3>${esc(o.producto)}</h3>
          ${o.descripcion ? `<p class="desc">${esc(o.descripcion)}</p>` : ''}
          <span class="cliente">👤 ${esc(o.cliente)}</span>
          <div class="precio">${formatoPrecio(o.precio, o.moneda)}</div>
          ${(wa || mail) ? `<div class="contactos">${wa}${mail}</div>` : ''}
          <div class="card-foot">
            <span class="fecha">📅 ${formatoFecha(o.creado)}</span>
            <div class="mini-btns">
              <button class="icon-btn" data-accion="editar" data-id="${o.id}" title="Editar">✏️</button>
              <button class="icon-btn del" data-accion="eliminar" data-id="${o.id}" title="Eliminar">🗑️</button>
            </div>
          </div>
        </div>
      </article>`;
  }).join('');

  const hayFiltro = q || fe || fc;
  vacio.classList.toggle('oculto', lista.length > 0);
  if (lista.length === 0) {
    const t = vacio.querySelector('h3');
    const p = vacio.querySelector('p');
    const b = $('btnVacio');
    if (hayFiltro) {
      t.textContent = 'Sin resultados';
      p.textContent = 'No hay ofertas que coincidan con los filtros aplicados.';
      b.classList.add('oculto');
    } else {
      t.textContent = 'No hay ofertas todavía';
      p.textContent = 'Publica la primera oferta de venta de tus clientes.';
      b.classList.remove('oculto');
    }
  }

  const disponibles = ofertas.filter(o => o.estado === 'Disponible').length;
  const vendidas    = ofertas.filter(o => o.estado === 'Vendido').length;
  $('contador').innerHTML = `<strong>${lista.length}</strong> de ${ofertas.length} oferta(s) mostradas`;
  $('stats').innerHTML = `🟢 ${disponibles} disponibles · ✅ ${vendidas} vendidas`;
}

/* ==================== CATEGORÍAS ==================== */
function pintarCategorias() {
  const usadas = [...new Set(ofertas.map(o => o.categoria).filter(Boolean))];
  const todas = [...new Set([...CATEGORIAS_BASE, ...usadas])].sort((a,b) => a.localeCompare(b,'es'));

  $('listaCategorias').innerHTML = todas.map(c => `<option value="${esc(c)}">`).join('');

  const sel = $('filtroCategoria');
  const actual = sel.value;
  sel.innerHTML = '<option value="">Todas las categorías</option>' +
    usadas.sort((a,b) => a.localeCompare(b,'es'))
         .map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if ([...sel.options].some(o => o.value === actual)) sel.value = actual;
}

/* ==================== MODAL ==================== */
const dlg = $('dlg');
const form = $('formOferta');

function abrirModal() {
  if (typeof dlg.showModal === 'function') {
    dlg.showModal();
  } else {
